[Window]
# Set these to match your in-game resolution (from the game launcher's Settings menu)
ResolutionX = 1600
ResolutionY = 1024

[Map]
# Filename of the map image to use (must be in the same folder as UWONavi)
file = map.png

[Hotkeys]
# Single key bindings (no modifiers). Case-insensitive.
recenter    = r
clear_track = c
relock      = l

[Display]
# Show the coordinate and speed bar (true/false). Default: true
show_coords = true

# Show the status bar at the bottom (true/false). Default: false
# Mainly useful for debugging — shows window detection and poll status.
show_status = false

# Save capture.png and capture_10x.png to a debug/ folder on every poll.
# Turn on to diagnose OCR failures. Default: false
debug_capture = false

[Behaviour]
# Automatically center the map on the first position fix after launch
auto_center_first = true

# How often to poll the game window for coordinates (seconds)
poll_interval = 1.0

# Maximum number of track points to keep in history
track_max_points = 2000

# OCR noise rejection threshold (0.0 to 1.0, lower = stricter).
# Coordinate reads where any digit scores above this are discarded.
# Increase if valid coords are being rejected; decrease if garbage is appearing.
ocr_noise_threshold = 0.35

# Length of the direction vector ray in game coordinate units
direction_vector_length = 18500

# Number of distinct coordinate readings used for direction calculation
# Higher = smoother but slower to respond to turns
direction_history_size = 12

[OfflineTesting]
# Uncomment and set values to pre-populate the direction vector state on launch.
# Format: lon,lat (e.g. 97,2496)
# These are overwritten as soon as a real coordinate is read from the game.
